<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Laboratorio de la esfera · ABRAX</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="assets/abrax-favicon.svg" />
    <style>
      :root {
        --cian: #2fd9ff;
        --violeta: #8b5cf6;
        --magenta: #f23dc4;
        --tinta: #05060f;
        --panel: #0b0d1c;
        --texto: #c9d4e0;
        --suave: #8a94a6;
        --borde: #1c2140;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
        background: var(--tinta);
        color: var(--texto);
        font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Menlo,
          Consolas, monospace;
        overflow: hidden;
      }
      #escena {
        position: fixed;
        inset: 0;
      }
      #esfera {
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
      }
      #esfera.arrastrando {
        cursor: grabbing;
      }
      .panel {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10;
        width: 300px;
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        background: rgba(11, 13, 28, 0.88);
        backdrop-filter: blur(10px);
        border: 1px solid var(--borde);
        border-radius: 14px;
        padding: 18px;
      }
      .panel h1 {
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #fff;
      }
      .panel h1::before {
        content: "◈ ";
        color: var(--violeta);
      }
      .panel .sub {
        font-size: 10px;
        color: var(--suave);
        letter-spacing: 0.08em;
        margin: 6px 0 14px;
      }
      .ctrl {
        margin-bottom: 13px;
      }
      .ctrl label {
        display: flex;
        justify-content: space-between;
        font-size: 10.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--suave);
        margin-bottom: 5px;
      }
      .ctrl label b {
        color: var(--cian);
        font-weight: 600;
      }
      .ctrl input[type="range"] {
        width: 100%;
        accent-color: var(--cian);
      }
      .fila-botones {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 14px 0;
      }
      button,
      select {
        font-family: inherit;
        font-size: 10.5px;
        letter-spacing: 0.1em;
        color: var(--texto);
        background: rgba(47, 217, 255, 0.08);
        border: 1px solid rgba(47, 217, 255, 0.35);
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
      }
      button:hover {
        background: rgba(47, 217, 255, 0.16);
      }
      button.preset {
        border-color: rgba(139, 92, 246, 0.5);
        background: rgba(139, 92, 246, 0.1);
      }
      button.activo {
        border-color: var(--magenta);
        background: rgba(242, 61, 196, 0.12);
      }
      #valores {
        font-size: 10.5px;
        line-height: 1.7;
        color: var(--cian);
        background: var(--tinta);
        border: 1px solid var(--borde);
        border-radius: 8px;
        padding: 10px 12px;
        white-space: pre;
        user-select: all;
      }
      .nota {
        font-size: 9.5px;
        color: var(--suave);
        margin-top: 10px;
        letter-spacing: 0.06em;
      }
    </style>
  </head>
  <body>
    <div id="escena"><canvas id="esfera"></canvas></div>

    <aside class="panel" aria-label="Controles del laboratorio">
      <h1>Lab · esfera</h1>
      <p class="sub">Esculpe en vivo. 1.00 = como el prototipo original.</p>

      <div class="ctrl">
        <label>Luz del núcleo <b id="v-nucleo">1.00</b></label>
        <input id="s-nucleo" type="range" min="0" max="1.5" step="0.05" value="1" />
      </div>
      <div class="ctrl">
        <label>Halo rosado <b id="v-halo">1.00</b></label>
        <input id="s-halo" type="range" min="0" max="1.5" step="0.05" value="1" />
      </div>
      <div class="ctrl">
        <label>Luz interior <b id="v-interior">1.00</b></label>
        <input
          id="s-interior"
          type="range"
          min="0"
          max="1.5"
          step="0.05"
          value="1"
        />
      </div>
      <div class="ctrl">
        <label>Picos blancos <b id="v-blanco">1.00</b></label>
        <input id="s-blanco" type="range" min="0" max="1.5" step="0.05" value="1" />
      </div>
      <div class="ctrl">
        <label>Orgánico (bultos) <b id="v-organico">0.00</b></label>
        <input id="s-organico" type="range" min="0" max="1.5" step="0.05" value="0" />
      </div>
      <div class="ctrl">
        <label>Ruido (estructura) <b id="v-ruido">0.00</b></label>
        <input id="s-ruido" type="range" min="0" max="0.6" step="0.02" value="0" />
      </div>
      <div class="ctrl">
        <label>Escala del ruido <b id="v-ruidoEscala">2.20</b></label>
        <input
          id="s-ruidoEscala"
          type="range"
          min="0.5"
          max="5"
          step="0.1"
          value="2.2"
        />
      </div>
      <div class="ctrl">
        <label>Velocidad del ruido <b id="v-ruidoVel">1.00</b></label>
        <input
          id="s-ruidoVel"
          type="range"
          min="0"
          max="3"
          step="0.1"
          value="1"
        />
      </div>
      <div class="ctrl">
        <label>Velocidad de giro <b id="v-giro">1.00</b></label>
        <input id="s-giro" type="range" min="0" max="2.5" step="0.1" value="1" />
      </div>
      <div class="ctrl">
        <label>Sensibilidad <b id="v-sens">1.00</b></label>
        <input id="s-sens" type="range" min="0.2" max="2.5" step="0.05" value="1" />
      </div>

      <div class="fila-botones">
        <button class="preset" id="btnSuave">Suave y viva</button>
        <button class="preset" id="btnMasa">Masa viva (ruido)</button>
        <button class="preset" id="btnOriginal">Original</button>
      </div>
      <div class="fila-botones">
        <button id="btnMic">🎤 Hablar con la esfera</button>
      </div>
      <div class="fila-botones">
        <button id="btnFeed">Simular dictado</button>
        <button id="btnVaciar">Vaciar</button>
        <select id="selCalidad" aria-label="Calidad">
          <option value="auto" selected>Auto</option>
          <option value="alta">Alta</option>
          <option value="media">Media</option>
          <option value="baja">Baja</option>
        </select>
      </div>
      <p class="sub" id="estado" role="status">
        modo demo · respiración sintética
      </p>

      <div id="valores">{}</div>
      <p class="nota">
        Copia estos valores y pásaselos a Claude para fijarlos en la landing.
        Página solo de desarrollo (noindex; no se enlaza desde la landing).
      </p>
    </aside>

    <script src="vendor/three.min.js"></script>
    <script src="js/esfera.js"></script>
    <script>
      (function () {
        "use strict";
        ESFERA.init({
          canvas: document.getElementById("esfera"),
          contenedor: document.getElementById("escena"),
          distancia: 3.4,
          onEstado: function (txt) {
            document.getElementById("estado").textContent = txt;
          },
        });

        const btnMic = document.getElementById("btnMic");
        btnMic.addEventListener("click", async function () {
          const activo = await ESFERA.toggleMic();
          btnMic.textContent = activo
            ? "⏹ Detener micrófono"
            : "🎤 Hablar con la esfera";
          btnMic.classList.toggle("activo", activo);
        });

        const claves = [
          "nucleo",
          "halo",
          "interior",
          "blanco",
          "organico",
          "ruido",
          "ruidoEscala",
          "ruidoVel",
          "giro",
        ];
        function leerSliders() {
          const o = {};
          claves.forEach(function (k) {
            o[k] = parseFloat(document.getElementById("s-" + k).value);
          });
          return o;
        }
        function pintarValores() {
          const o = leerSliders();
          claves.forEach(function (k) {
            document.getElementById("v-" + k).textContent = o[k].toFixed(2);
          });
          const s = parseFloat(document.getElementById("s-sens").value);
          document.getElementById("v-sens").textContent = s.toFixed(2);
          document.getElementById("valores").textContent = JSON.stringify(
            o,
            null,
            1,
          );
        }
        function aplicar() {
          ESFERA.tune(leerSliders());
          ESFERA.setSensitivity(
            parseFloat(document.getElementById("s-sens").value),
          );
          pintarValores();
        }
        claves.concat(["sens"]).forEach(function (k) {
          document.getElementById("s-" + k).addEventListener("input", aplicar);
        });

        function ponerSliders(o) {
          Object.keys(o).forEach(function (k) {
            const s = document.getElementById("s-" + k);
            if (s) s.value = o[k];
          });
          aplicar();
        }
        document.getElementById("btnSuave").addEventListener("click", () =>
          ponerSliders({
            nucleo: 0.55,
            halo: 0.7,
            interior: 1,
            blanco: 0.45,
            organico: 0.7,
            ruido: 0,
            ruidoEscala: 2.2,
            ruidoVel: 1,
            giro: 0.9,
          }),
        );
        document.getElementById("btnMasa").addEventListener("click", () =>
          ponerSliders({
            nucleo: 0.5,
            halo: 0.65,
            interior: 1.1,
            blanco: 0.4,
            organico: 0.3,
            ruido: 0.34,
            ruidoEscala: 2.2,
            ruidoVel: 0.9,
            giro: 0.85,
          }),
        );
        document.getElementById("btnOriginal").addEventListener("click", () =>
          ponerSliders({
            nucleo: 1,
            halo: 1,
            interior: 0,
            blanco: 1,
            organico: 0,
            ruido: 0,
            ruidoEscala: 2.2,
            ruidoVel: 1,
            giro: 1,
          }),
        );

        let feed = false;
        const btnFeed = document.getElementById("btnFeed");
        btnFeed.addEventListener("click", function () {
          feed = !feed;
          if (feed) ESFERA.iniciarFeed(900);
          else ESFERA.detenerFeed();
          btnFeed.textContent = feed ? "● Escuchando…" : "Simular dictado";
          btnFeed.classList.toggle("activo", feed);
        });
        document
          .getElementById("btnVaciar")
          .addEventListener("click", () => ESFERA.vaciarPalabras());
        document
          .getElementById("selCalidad")
          .addEventListener("change", (e) => ESFERA.setQuality(e.target.value));

        pintarValores();
      })();
    </script>
  </body>
</html>
