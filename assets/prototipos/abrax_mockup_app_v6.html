<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABRAX · Mockup v6 — todo dentro del iris, sin ventanas</title>
<style>
  :root{
    --cian:#2FD9FF; --violeta:#8B5CF6; --magenta:#F23DC4;
    --tinta:#05060F; --borde:#1C2140; --texto:#C9D4E0; --suave:#6B7688; --blanco:#EAF0FF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 700px at 74% 12%, #0B0D22 0%, transparent 58%),
      radial-gradient(1000px 640px at 14% 92%, #150A22 0%, transparent 55%),
      var(--tinta);
    color:var(--texto);
    font-family:ui-monospace,"Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
    overflow:hidden;
  }
  kbd{display:inline-block; padding:2px 8px; border:1px solid #2A3160; border-bottom-width:2px;
    border-radius:6px; background:rgba(16,19,42,.8); color:var(--blanco); font:inherit; font-size:11px}

  /* ── el escenario: TODO flota, nada de barras ── */
  #stage{position:relative; width:100%; height:100%}
  #marco{position:absolute; inset:14px; border:1px dashed #232a52; border-radius:20px; pointer-events:none}
  #marco::after{content:"límite real de la ventana — transparente e invisible en producción";
    position:absolute; top:-9px; left:18px; background:var(--tinta); padding:0 8px;
    font-size:9px; letter-spacing:.14em; color:#3a4470; text-transform:uppercase}

  /* chips fantasma flotantes (sin barra) */
  .ghost{position:absolute; display:flex; align-items:center; gap:9px; font-size:10.5px;
    letter-spacing:.12em; color:var(--texto); z-index:3}
  #gMarca{top:30px; left:34px}
  #gMarca svg{width:24px;height:24px}
  #gMarca b{letter-spacing:.34em; color:#fff; font-weight:600; font-size:13px}
  #gMarca b i{font-style:normal; background:linear-gradient(135deg,var(--cian),var(--magenta));
    -webkit-background-clip:text; background-clip:text; color:transparent}
  #gEstado{top:32px; right:34px; gap:14px}
  .pillg{border:1px solid var(--borde); border-radius:99px; padding:5px 11px; background:rgba(6,7,18,.35); cursor:default}
  .pillg.ok{border-color:#1d4a3a; color:#7ce7b0}
  #gStatus{bottom:26px; left:50%; transform:translateX(-50%); color:#39406b; letter-spacing:.14em; font-size:9.5px}

  /* ── composición central: esfera + órbita ── */
  #orbe{position:absolute; left:50%; top:47%; transform:translate(-50%,-50%);
    width:min(740px, 96vmin); aspect-ratio:1}
  #esfera{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); cursor:pointer}
  #svgOrb{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
  .nodo{cursor:pointer}
  .nodo circle.aro{transition:stroke-width .16s ease, filter .16s ease}
  .nodo text{font-family:inherit; font-size:12.5px; letter-spacing:.22em; fill:#8f9ab3; pointer-events:none; transition:fill .16s ease}
  .nodo .glifo{fill:none; stroke:#DDE6FA; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; opacity:.88}
  .nodo.sel text{fill:#fff}
  .nodo.sel circle.aro{stroke-width:3.2; filter:drop-shadow(0 0 8px currentColor)}
  .nodo text.plan{font-size:8px; letter-spacing:.1em; fill:var(--violeta)}
  .spoke{opacity:.10; transition:opacity .2s ease}
  .sector-on .spoke{opacity:.6; animation:flujo 1.1s linear infinite}
  @keyframes flujo{ to{ stroke-dashoffset:-22 } }

  /* hint permanente + tipeo, flotando bajo la órbita */
  #bajoEsfera{position:absolute; left:50%; bottom:52px; transform:translateX(-50%);
    text-align:center; width:min(640px,92vw); pointer-events:none; z-index:3}
  #atajoHint{font-size:11.5px; color:var(--suave); letter-spacing:.08em}
  #typed{margin-top:9px; min-height:22px; font-size:13.5px; color:var(--blanco); letter-spacing:.03em}
  #typed::before{content:"› "; color:var(--cian)}
  .caret{display:inline-block; width:8px; height:15px; background:var(--cian); margin-left:2px;
    animation:parp 1s steps(1) infinite; vertical-align:-2px}
  @keyframes parp{50%{opacity:0}}

  /* el contenido vive DENTRO del iris — sin ventana */
  #iris{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:322px; height:436px; z-index:6;
    opacity:0; pointer-events:none; transition:opacity .3s ease .14s;
  }
  #iris.abierto{opacity:1; pointer-events:auto}
  #irisBody{
    height:100%; overflow-y:auto; scrollbar-width:none;
    padding:78px 4px 88px; font-size:12.5px; line-height:1.7;
    display:grid; gap:16px; align-content:start;
    -webkit-mask-image:linear-gradient(transparent, #000 72px, #000 calc(100% - 84px), transparent);
    mask-image:linear-gradient(transparent, #000 72px, #000 calc(100% - 84px), transparent);
  }
  #irisBody::-webkit-scrollbar{display:none}
  .secTit{text-align:center; margin-bottom:2px}
  .secTit h2{font-size:13px; letter-spacing:.3em; color:#fff; font-weight:600; display:inline}
  .secTit .plan{display:block; width:max-content; margin:7px auto 0; font-size:9px; letter-spacing:.12em;
    color:var(--violeta); border:1px solid var(--violeta); border-radius:6px; padding:2px 7px}
  #cerrar{
    position:absolute; top:2px; left:50%; transform:translateX(-50%); z-index:2;
    background:rgba(8,10,24,.5); border:1px solid rgba(70,82,160,.4); color:var(--texto);
    border-radius:50%; width:28px; height:28px; font:inherit; cursor:pointer; backdrop-filter:blur(6px);
  }
  #cerrar:hover{border-color:var(--magenta); color:#fff}
  .caja{border:none; border-radius:0; padding:0; background:none}
  .caja h3{font-size:10px; letter-spacing:.22em; color:var(--suave); margin-bottom:8px; font-weight:600}
  .fila{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed rgba(60,70,140,.25)}
  .fila:last-child{border-bottom:none}
  .fila .crece{flex:1; min-width:0}
  .fila small{color:var(--suave); font-size:10.5px; display:block}
  .chip{display:inline-flex; align-items:center; gap:7px; border:1px solid rgba(60,70,140,.4);
    border-radius:99px; padding:4px 11px; font-size:11.5px; margin:0 6px 6px 0; background:rgba(14,17,36,.4)}
  .chip b{color:var(--cian); font-weight:600}
  .chip .x{color:var(--suave); cursor:pointer}
  .chip .x:hover{color:var(--magenta)}
  .lintchip{border-color:#5a4a12; color:#F5C044}
  .tgl{width:36px; height:20px; border-radius:99px; background:rgba(26,31,61,.7); position:relative;
    cursor:pointer; flex:none; border:1px solid rgba(60,70,140,.4)}
  .tgl::after{content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%;
    background:#5b6485; transition:all .18s ease}
  .tgl.on{background:linear-gradient(90deg,var(--violeta),var(--magenta))}
  .tgl.on::after{left:18px; background:#fff}
  .btn{border:1px solid rgba(60,70,140,.4); background:rgba(14,17,36,.4); color:var(--texto);
    border-radius:9px; padding:7px 13px; font:inherit; font-size:11px; letter-spacing:.1em; cursor:pointer}
  .btn:hover{border-color:var(--cian); color:#fff}
  .btn.prim{border-color:var(--violeta); color:#fff}
  .flecha{color:var(--violeta); text-align:center; font-size:14px}
  .codebox{background:rgba(8,10,24,.35); border:none; border-left:2px solid var(--cian);
    border-radius:0 10px 10px 0; padding:10px 12px; font-size:11.5px; line-height:1.75; color:#B7C3DE; white-space:pre-wrap}
  .codebox .sec{color:var(--cian)}
  .modcard{display:flex; align-items:center; gap:12px}
  .estado{font-size:9.5px; letter-spacing:.12em; padding:3px 8px; border-radius:6px}
  .activo{background:rgba(47,217,255,.12); color:var(--cian); border:1px solid rgba(47,217,255,.4)}
  .es{color:#7ce7b0; font-size:10px}

  /* ── tooltip ── */
  #tip{position:fixed; z-index:99; max-width:290px; background:rgba(13,16,36,.92);
    border:1px solid #2A3160; border-radius:11px; padding:11px 13px; font-size:11.5px; line-height:1.6;
    color:var(--texto); backdrop-filter:blur(8px); box-shadow:0 12px 34px rgba(0,0,0,.55);
    opacity:0; pointer-events:none; transition:opacity .14s ease}
  #tip.on{opacity:1}
  #tip b{display:block; color:#fff; letter-spacing:.14em; font-size:10.5px; margin-bottom:4px}
  #tip .keys{margin-top:7px; display:flex; gap:5px; align-items:center}
  #tip .keys i{font-style:normal; color:var(--suave)}

  #toast{position:absolute; left:50%; bottom:96px; transform:translate(-50%,10px); z-index:7;
    background:rgba(11,13,28,.85); border:1px solid #1d4a3a; color:#7ce7b0; font-size:12px;
    border-radius:10px; padding:9px 16px; opacity:0; transition:all .25s ease; backdrop-filter:blur(8px)}
  #toast.on{opacity:1; transform:translate(-50%,0)}

  button:focus-visible, .nodo:focus-visible{outline:2px solid var(--violeta); outline-offset:3px; border-radius:8px}
  @media (prefers-reduced-motion: reduce){ .caret{animation:none} .sector-on .spoke{animation:none} #iris{transition:none} }
</style>
</head>
<body>

<div id="stage">
  <div id="marco"></div>

  <div class="ghost" id="gMarca" data-hint="ABRAX|Dictado con IA 100% local. Di la palabra.|">
    <svg viewBox="0 0 120 120"><defs><linearGradient id="gt" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2FD9FF"/><stop offset=".55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F23DC4"/></linearGradient></defs><circle cx="60" cy="60" r="40" fill="none" stroke="url(#gt)" stroke-width="5"/><circle cx="60" cy="60" r="26" fill="none" stroke="url(#gt)" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 12.5"/><circle cx="60" cy="60" r="8" fill="#fff"/></svg>
    <b>ΛBR<i>ΛX</i></b>
  </div>
  <div class="ghost" id="gEstado">
    <span class="pillg" data-hint="Modelo activo|Canary 180M Flash transcribe en tu equipo, sin nube. Cámbialo en MODELOS.|">Canary 180M Flash · Español</span>
    <span class="pillg ok" data-hint="Privacidad|Tu voz jamás sale de este computador. Sin cuentas, sin nube, sin telemetría.|">● 100% LOCAL</span>
  </div>

  <div id="orbe">
    <canvas id="esfera" width="560" height="560"
      data-hint="DICTAR|Mantén presionado el atajo y habla. Suelta, y el texto se pega donde estés escribiendo. Esc cancela.|Ctrl,Space"></canvas>
    <svg id="svgOrb" viewBox="0 0 740 740" role="menu" aria-label="Menú orbital de ABRAX"></svg>
    <div id="iris" aria-hidden="true">
      <button id="cerrar" data-hint="Cerrar|Vuelve a la esfera. Clic en el anillo también cierra.|Esc">✕</button>
      <div id="irisBody"></div>
    </div>
  </div>

  <div id="bajoEsfera">
    <div id="atajoHint">mantén presionado <kbd>Ctrl</kbd> + <kbd>Space</kbd> y habla — suelta para pegar</div>
    <div id="typed"><span class="caret"></span></div>
  </div>

  <div id="toast"></div>
  <div class="ghost" id="gStatus">actualizaciones deshabilitadas · v0.9.1-abrax · di la palabra</div>
</div>

<div id="tip" role="tooltip"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const reducido = matchMedia("(prefers-reduced-motion: reduce)").matches;
const t0 = performance.now();
let grabando = false, seleccion = -1, panelOn = false;

/* ═ colores del degradado diagonal (cian arriba-der → magenta abajo-izq) ═ */
function colorDeg(deg){
  const t = (Math.sin((deg-45)*Math.PI/180)+1)/2;
  const mix=(a,b,k)=>Math.round(a+(b-a)*k);
  const CIA=[47,217,255], VIO=[139,92,246], MAG=[242,61,196];
  const par = t>.5 ? [VIO,CIA,(t-.5)*2] : [MAG,VIO,t*2];
  return `rgb(${mix(par[0][0],par[1][0],par[2])},${mix(par[0][1],par[1][1],par[2])},${mix(par[0][2],par[1][2],par[2])})`;
}

/* ═══ 1 · LA ESFERA VIVA AL CENTRO (canvas, vista polar) ═══ */
const cv = $("#esfera"), ctx = cv.getContext("2d");
const SZ = 560, C = SZ/2;
const puntos = [];
let aper = 0;
const RAP = 210, RMAXG = 252;
function colorPunto(rr, a){
  const x = Math.cos(a), y = Math.sin(a);
  const t = Math.min(1, Math.max(0, (x - y)*0.5 + 0.5));
  const mix = (A,B,k)=>A.map((v,i)=>Math.round(v+(B[i]-v)*k));
  const BL=[255,247,252], MG=[255,64,204], VI=[124,78,240], CI=[47,217,255];
  let c = mix(MG, t>0.5?CI:VI, Math.abs(t-0.5)*2*0.9);
  c = mix(BL, c, Math.min(1, rr*4.2));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
(function sembrar(){
  const NR = 30, Rmax = 252;
  for(let i=1;i<=NR;i++){
    const rr = i/NR, r = 10 + rr*(Rmax-10);
    const n = Math.max(9, Math.floor(2*Math.PI*r/5.6));
    for(let j=0;j<n;j++){
      const a = j/n*2*Math.PI;
      puntos.push({rr, r, a, fase:Math.random()*6.28, col:colorPunto(rr, a)});
    }
  }
})();
function dibujarEsfera(t){
  const aTar = panelOn ? 1 : 0;
  aper += (aTar - aper) * (reducido ? 1 : 0.09);
  ctx.clearRect(0,0,SZ,SZ);
  const boost = grabando ? 1 : 0.34;
  for(const p of puntos){
    const ramp = Math.pow(Math.max(0,(p.rr-0.22))/0.78, 1.3);
    const ondas = Math.sin(p.a*5 + t*0.9 + p.rr*22)*0.5
                + Math.sin(p.a*9 - t*0.6 + p.rr*37)*0.3
                + Math.sin(p.a*16 + t*1.3)*0.2;
    let dom = 0;
    if(grabando){
      let d = (p.a*57.29578 - (t*40)%360 + 540)%360 - 180;
      dom = Math.exp(-(d*d)/1156);
    }
    const disp = (ondas*9*ramp + dom*12) * boost + (reducido?0:Math.sin(t*1.2+p.fase)*0.6);
    // iris: al abrir una sección, los puntos migran al borde y el interior queda libre
    const rIris = RAP + p.r*(RMAXG-RAP)/RMAXG;
    const R = p.r + (rIris - p.r)*aper + disp;
    const x = C + R*Math.cos(p.a), y = C + R*Math.sin(p.a);
    const luz = 0.42 + Math.max(0,ondas)*0.4*ramp*boost + dom*0.6 + (p.rr<0.12?0.5:0);
    ctx.globalAlpha = Math.min(1, luz) * (1 - aper*0.15);
    ctx.fillStyle = p.col;
    ctx.fillRect(x-1, y-1, 2, 2);
  }
  ctx.globalAlpha = Math.max(0, 1 - aper);   // el núcleo se disuelve al abrirse el iris
  const rN = 6.5 + (grabando ? Math.sin(t*6)*2.4 : Math.sin(t*1.4)*0.8);
  const g = ctx.createRadialGradient(C,C,0,C,C,30);
  g.addColorStop(0, grabando ? "rgba(242,61,196,.9)" : "rgba(255,255,255,.85)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(C,C,30,0,7); ctx.fill();
  ctx.fillStyle = grabando ? "#F23DC4" : "#fff";
  ctx.beginPath(); ctx.arc(C,C,rN,0,7); ctx.fill();
}

/* ═══ 2 · LA ÓRBITA con física de frecuencia dominante (SVG) ═══ */
const svg = $("#svgOrb");
const OX = 370, OY = 370, R_ORB = 300, N_ORB = 176;
const orbPts = [];
const pol = (deg, r) => {
  const t = (deg-90)*Math.PI/180;
  return [OX + r*Math.cos(t), OY + r*Math.sin(t)];
};
const angDist = (a,b)=>{ let d=Math.abs(a-b)%360; return d>180 ? 360-d : d; };

const GLIFOS = {
  libro:"M-8,-9 h10 a5,5 0 0 1 5,5 v13 h-10 a5,5 0 0 0 -5,3 Z M7,-9 v18",
  varita:"M-9,9 L6,-6 M6,-6 l3,-3 M4,-11 v3 M9,-4 h3 M1,-8 l2,2",
  onda:"M-10,0 h3 l2,-6 3,12 3,-9 2,3 h7",
  filtro:"M-9,-8 h18 L3,1 v8 l-6,3 v-11 Z",
  reloj:"M0,0 m-9,0 a9,9 0 1 0 18,0 a9,9 0 1 0 -18,0 M0,-4 v4 l3,2",
  chip:"M-7,-7 h14 v14 h-14 Z M-2,-7 v-3 M2,-7 v-3 M-2,7 v3 M2,7 v3 M-7,-2 h-3 M-7,2 h-3 M7,-2 h3 M7,2 h3",
  tuerca:"M0,0 m-3.5,0 a3.5,3.5 0 1 0 7,0 a3.5,3.5 0 1 0 -7,0 M0,-10 v3 M0,7 v3 M-10,0 h3 M7,0 h3 M-7,-7 l2,2 M5,5 l2,2 M7,-7 l-2,2 M-5,5 l-2,2",
  info:"M0,0 m-9,0 a9,9 0 1 0 18,0 a9,9 0 1 0 -18,0 M0,-3.5 v0.5 M0,0 v5",
};
const NODOS = [
  {id:"diccionario", label:"DICCIONARIO", glifo:"libro",  plan:true,
   hint:"Diccionario Vivo por Proyecto|ABRAX indexa tu repo local y escribe useAuthStore, kubectl o tu rama exactos — Spanglish incluido. Nada sale de tu equipo. (EN PLAN)|"},
  {id:"compilador",  label:"COMPILADOR",  glifo:"varita", plan:true,
   hint:"Compilador de Prompts|Habla como piensas; ABRAX lo estructura en secciones y su linter marca las ambigüedades antes de enviarlas a la IA. (EN PLAN)|"},
  {id:"escucha",     label:"ESCUCHA",     glifo:"onda",   plan:true,
   hint:"Escucha tu Código|La vuelta del viaje: ABRAX te lee un README o un diff — prosa con voz natural, código con voz técnica. (EN PLAN)|"},
  {id:"muletillas",  label:"MULETILLAS",  glifo:"filtro",
   hint:"Filtro de Muletillas|Elimina «eh», «o sea», «cachái» al instante, sin ningún modelo de IA. Tú decides la lista.|"},
  {id:"historial",   label:"HISTORIAL",   glifo:"reloj",
   hint:"Historial|Tus dictados recientes, guardados solo en tu disco. Clic en uno = copiar.|"},
  {id:"modelos",     label:"MODELOS",     glifo:"chip",
   hint:"Modelos|Elige el motor de transcripción. Todos corren en tu equipo y se verifican con checksum al descargar.|"},
  {id:"ajustes",     label:"AJUSTES",     glifo:"tuerca",
   hint:"Ajustes|Atajo, idioma, micrófono y comportamiento. Cambia el atajo con un clic.|"},
  {id:"acerca",      label:"ACERCA DE",   glifo:"info",
   hint:"Acerca de ABRAX|Open source (MIT), sobre Handy con crédito íntegro.|"},
];

function construirOrbita(){
  // rayos por sector (bandas de ecualizador, punteadas y finas)
  NODOS.forEach((op,k)=>{
    const deg=k*45, c=colorDeg(-90+deg);
    const g=document.createElementNS(NS,"g");
    g.dataset.sector=k;
    [-8,8].forEach(off=>{
      const [x1,y1]=pol(deg+off,262), [x2,y2]=pol(deg+off,288);
      const l=document.createElementNS(NS,"line");
      l.setAttribute("x1",x1); l.setAttribute("y1",y1);
      l.setAttribute("x2",x2); l.setAttribute("y2",y2);
      l.setAttribute("stroke",c); l.setAttribute("stroke-width","2.4");
      l.setAttribute("stroke-linecap","round");
      l.setAttribute("stroke-dasharray","0.01 11");
      l.setAttribute("class","spoke");
      g.appendChild(l);
    });
    svg.appendChild(g);
  });
  // el anillo de puntos
  const gOrb=document.createElementNS(NS,"g");
  for(let i=0;i<N_ORB;i++){
    const a=i*360/N_ORB;
    const p=document.createElementNS(NS,"circle");
    p.setAttribute("fill", colorDeg(-90+a));
    orbPts.push({el:p, ang:a, f:0, fase:Math.random()*6.28});
    gOrb.appendChild(p);
  }
  svg.appendChild(gOrb);
  // nodos-opción sobre la órbita (trazo fino, como el prototipo aprobado)
  NODOS.forEach((op,k)=>{
    const deg=k*45, c=colorDeg(-90+deg);
    const [nx,ny]=pol(deg,R_ORB);
    const [lx,ly]=pol(deg,346);
    const g=document.createElementNS(NS,"g");
    g.setAttribute("class","nodo"); g.dataset.k=k; g.style.color=c;
    g.setAttribute("role","menuitem"); g.setAttribute("tabindex","0");
    g.setAttribute("data-hint", op.hint);
    g.innerHTML =
      `<circle cx="${nx}" cy="${ny}" r="29" fill="${c}" opacity="0.10"/>`+
      `<circle class="aro" cx="${nx}" cy="${ny}" r="25" fill="rgba(10,12,26,.82)" stroke="${c}" stroke-width="2.1"/>`+
      `<path class="glifo" d="${GLIFOS[op.glifo]}" transform="translate(${nx} ${ny})"/>`+
      `<text x="${lx}" y="${ly+4}" text-anchor="middle">${op.label}</text>`+
      (op.plan ? `<text class="plan" x="${lx}" y="${ly+18}" text-anchor="middle">EN PLAN</text>` : "");
    g.addEventListener("click", ()=>abrirPanel(op.id, k));
    g.addEventListener("mouseenter", ()=>{ if(!panelOn) marcar(k); });
    g.addEventListener("focus", ()=>{ if(!panelOn) marcar(k); });
    g.addEventListener("mouseleave", ()=>{ if(!panelOn) marcar(-1); });
    g.addEventListener("keydown", e=>{ if(e.key==="Enter") abrirPanel(op.id, k); });
    svg.appendChild(g);
  });
}
construirOrbita();

function marcar(k){
  seleccion=k;
  svg.querySelectorAll(".nodo").forEach(n=>n.classList.toggle("sel", +n.dataset.k===k));

}

/* ═══ 3 · UN SOLO LOOP: esfera + física orbital ═══ */
function animar(now){
  const t=(now-t0)/1000;
  dibujarEsfera(t);
  const objetivo = seleccion>=0 ? seleccion*45 : null;
  for(const p of orbPts){
    const fObj = objetivo===null ? 0 : Math.exp(-Math.pow(angDist(p.ang,objetivo)/20,2));
    p.f += (fObj - p.f) * (reducido ? 1 : 0.14);
    const shimmer = reducido ? 0 : Math.sin(t*1.3 + p.fase)*(grabando?1.1:0.5);
    const r = R_ORB + p.f*16 + shimmer;
    const rad = (p.ang-90)*Math.PI/180;
    p.el.setAttribute("cx", OX + r*Math.cos(rad));
    p.el.setAttribute("cy", OY + r*Math.sin(rad));
    p.el.setAttribute("r", (2.0 + p.f*2.0).toFixed(2));
    let op = 0.40 + p.f*0.60 + (reducido?0:0.08*Math.sin(t*1.1+p.fase));
    if(panelOn) op *= (seleccion>=0 && angDist(p.ang, seleccion*45) < 26) ? 1 : 0.6;
    p.el.setAttribute("opacity", op.toFixed(2));
  }
  requestAnimationFrame(animar);
}
requestAnimationFrame(animar);

/* ═══ 5 · TOOLTIPS con teclas ═══ */
const tip = $("#tip");
function mostrarTip(el){
  const partes = (el.dataset.hint||"").split("|");
  const tit = partes[0], desc = partes[1]||"", keys = partes[2]||"";
  if(!tit) return;
  tip.innerHTML = "<b>"+tit+"</b>"+desc +
    (keys ? '<div class="keys"><i>mantén</i> '+keys.split(",").map(k=>"<kbd>"+k.trim()+"</kbd>").join(" + ")+"</div>" : "");
  tip.classList.add("on");
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = Math.min(Math.max(10, r.left + r.width/2 - tw/2), innerWidth - tw - 10);
  let y = r.top - th - 12; if(y < 8) y = r.bottom + 12;
  tip.style.left = x+"px"; tip.style.top = y+"px";
}
document.addEventListener("mouseover", e=>{
  const el = e.target.closest("[data-hint]");
  if(el) mostrarTip(el); else tip.classList.remove("on");
});
document.addEventListener("focusin", e=>{
  const el = e.target.closest("[data-hint]");
  if(el) mostrarTip(el); else tip.classList.remove("on");
});

/* ═══ 6 · DEMO DE DICTADO: mantén Ctrl+Space ═══ */
const FRASES = [
  "crea un useAuthStore que persista el token en el localStorage",
  "kubectl get pods del namespace de staging",
  "renombra la rama feature/oauth-refresh a hotfix/token-expiry",
];
let fraseIdx = 0, typerId = 0;
const typed = $("#typed");
function empezar(){
  if(grabando) return;
  grabando = true;
  typed.innerHTML = '<span class="caret"></span>';
  const frase = FRASES[fraseIdx++ % FRASES.length];
  const caret = typed.querySelector(".caret");
  let i = 0;
  typerId = setInterval(()=>{
    if(i < frase.length) typed.insertBefore(document.createTextNode(frase[i++]), caret);
    else clearInterval(typerId);
  }, 30);
}
function parar(){
  if(!grabando) return;
  grabando = false;
  clearInterval(typerId);
  const t = $("#toast");
  t.textContent = "✓ pegado donde estabas escribiendo";
  t.classList.add("on");
  clearTimeout(parar.t); parar.t = setTimeout(()=>t.classList.remove("on"), 2200);
}
document.addEventListener("keydown", e=>{
  if(e.code==="Space" && e.ctrlKey){ e.preventDefault(); empezar(); }
  if(e.key==="Escape"){
    if(grabando){ clearInterval(typerId); grabando=false; typed.innerHTML='<span class="caret"></span>'; }
    else cerrarPanel();
  }
  if(panelOn) return;
  if(e.key==="ArrowRight"||e.key==="ArrowDown"){ marcar(((seleccion<0?-1:seleccion)+1)%8); e.preventDefault(); }
  if(e.key==="ArrowLeft" ||e.key==="ArrowUp"){ marcar(((seleccion<0?1:seleccion)+7)%8); e.preventDefault(); }
  if(e.key==="Enter" && seleccion>=0) abrirPanel(NODOS[seleccion].id, seleccion);
});
document.addEventListener("keyup", e=>{
  if(e.code==="Space" || e.key==="Control") parar();
});
cv.addEventListener("click", ()=>{
  if(panelOn) return cerrarPanel();
  grabando ? parar() : empezar();
});
