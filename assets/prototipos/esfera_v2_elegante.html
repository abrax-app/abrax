<html lang="es">
<head>

<style>

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ══════════════ Configuración ══════════════ */
const BANDAS = 32;
const NIVELES = {
  alta:  { puntos: 120000, dpr: 1.75 },
  media: { puntos:  60000, dpr: 1.50 },
  baja:  { puntos:  25000, dpr: 1.25 },
};
const reducirMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function nivelAuto(){
  const tosco = window.matchMedia('(pointer: coarse)').matches;
  if (tosco || innerWidth < 820) return 'baja';
  return (devicePixelRatio > 1.6) ? 'media' : 'alta';
}

/* ══════════════ Escena base ══════════════ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, alpha:false, powerPreference:'high-performance' });
renderer.setClearColor(0x04040c, 1);

const escena = new THREE.Scene();
const camara = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 60);
camara.position.set(0, 0, 2.9);

/* Grupos: holder (inclinación por arrastre) > spinner (rotación planeta) */
const holder = new THREE.Group();
const spinner = new THREE.Group();
holder.add(spinner);
escena.add(holder);

/* ══════════════ Texturas útiles (canvas) ══════════════ */
function texturaRadial(r, g, b, aCentro){
  const s = 256, cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const gr = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  gr.addColorStop(0.0, 'rgba(' + r + ',' + g + ',' + b + ',' + aCentro + ')');
  gr.addColorStop(0.35,'rgba(' + r + ',' + g + ',' + b + ',' + (aCentro*0.35) + ')');
  gr.addColorStop(1.0, 'rgba(' + r + ',' + g + ',' + b + ',0)');
  ctx.fillStyle = gr; ctx.fillRect(0,0,s,s);
  const tx = new THREE.CanvasTexture(cv);
  return tx;
}

/* ══════════════ Fondo: nebulosa, estrellas, destello ══════════════ */
function spriteGlow(r,g,b,alfa,escala,x,y,z){
  const m = new THREE.SpriteMaterial({ map:texturaRadial(r,g,b,alfa), blending:THREE.AdditiveBlending, depthWrite:false, transparent:true });
  const sp = new THREE.Sprite(m);
  sp.scale.setScalar(escala); sp.position.set(x,y,z);
  return sp;
}
escena.add(spriteGlow( 38,217,255, 0.12, 9.5,  2.6,  1.9, -6));   // nebulosa cian arriba-derecha
escena.add(spriteGlow(242, 51,192, 0.10, 10.5,-2.8, -2.2, -6.5)); // nebulosa magenta abajo-izquierda
escena.add(spriteGlow(210,235,255, 0.26, 1.6,  2.1,  1.55,-2.5)); // destello discreto sup-derecha
/* bokeh suave: pocas luces desenfocadas de distinto tamaño */
for (let i=0;i<9;i++){
  const frio = Math.random() < 0.5;
  escena.add(spriteGlow(frio?140:255, frio?210:150, frio?255:220,
    0.08 + Math.random()*0.07,
    0.25 + Math.random()*0.55,
    (Math.random()-0.5)*7.5, (Math.random()-0.5)*5.5, -4 - Math.random()*4));
}

const estrellas = (function(){
  const N = 220, pos = new Float32Array(N*3);
  for (let i=0;i<N;i++){
    const R = 6 + Math.random()*9;
    const a = Math.random()*Math.PI*2, b = Math.acos(2*Math.random()-1);
    pos[i*3]   = R*Math.sin(b)*Math.cos(a);
    pos[i*3+1] = R*Math.sin(b)*Math.sin(a);
    pos[i*3+2] = -Math.abs(R*Math.cos(b)) - 2;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  const m = new THREE.PointsMaterial({ size:0.022, color:0x8fb6d9, transparent:true, opacity:0.40, depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true });
  const p = new THREE.Points(g,m);
  escena.add(p);
  return p;
})();

/* Núcleo oscuro y opaco: bloquea los puntos traseros para que los anillos frontales se lean */
const nucleoOscuro = new THREE.Mesh(
  new THREE.SphereGeometry(0.86, 48, 48),
  new THREE.MeshBasicMaterial({ color:0x05050e })
);
spinner.add(nucleoOscuro);

/* Punto brillante central (late con la voz) */
const nucleoGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map:texturaRadial(200,240,255,0.9), blending:THREE.AdditiveBlending, depthWrite:false, transparent:true
}));
nucleoGlow.position.set(0,0,1.0);
nucleoGlow.scale.setScalar(0.34);
spinner.add(nucleoGlow);

/* halo rosado suave alrededor del núcleo */
const haloRosa = new THREE.Sprite(new THREE.SpriteMaterial({
  map:texturaRadial(255,120,200,0.45), blending:THREE.AdditiveBlending, depthWrite:false, transparent:true
}));
haloRosa.position.set(0,0,0.95);
haloRosa.scale.setScalar(1.25);
spinner.add(haloRosa);

/* ══════════════ Geometría de la esfera de puntos ══════════════ */
/* Anillos concéntricos (latitudes) con el polo hacia la cámara.
   aRing = φ/π (0 = polo frontal, 0.5 = ecuador/borde visible, 1 = polo trasero).
   Leve desplazamiento angular por anillo → espiral suave. */
function construirGeometria(total){
  const anillos = Math.max(90, Math.round(Math.sqrt(total)*0.62));
  const phiMax = Math.PI*0.97;
  const pesos = []; let suma = 0;
  for (let i=0;i<anillos;i++){
    const phi = (i+0.5)/anillos*phiMax;
    const w = Math.sin(phi)+0.03; pesos.push(w); suma += w;
  }
  const pos=[], aR=[], aA=[], aRd=[];
  for (let i=0;i<anillos;i++){
    const phi = (i+0.5)/anillos*phiMax;
    const n = Math.max(3, Math.round(total*pesos[i]/suma));
    const espiral = i*0.37;
    const s = Math.sin(phi), c = Math.cos(phi);
    for (let j=0;j<n;j++){
      const th = j/n*Math.PI*2 + espiral + (Math.random()-0.5)*0.014;
      pos.push(s*Math.cos(th), s*Math.sin(th), c);
      aR.push(phi/Math.PI);
      aA.push(th);
      aRd.push(Math.random());
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('aRing',   new THREE.Float32BufferAttribute(aR,1));
  g.setAttribute('aAngle',  new THREE.Float32BufferAttribute(aA,1));
  g.setAttribute('aRand',   new THREE.Float32BufferAttribute(aRd,1));
  return g;
}

/* ══════════════ Shaders ══════════════ */
const VERT = `
#define PI 3.14159265
uniform float uTime;
uniform float uRMS;
uniform float uBass;
uniform float uSens;
uniform float uReduced;
uniform float uScale;
uniform float uSize;
uniform float uPushAngle;
uniform float uPushRing;
uniform float uPushAmt;
uniform float uBands[32];
attribute float aRing;
attribute float aAngle;
attribute float aRand;
varying float vEnergy;
varying float vWarm;
varying float vShade;
varying float vRR;
varying vec3  vWorld;

float bandAt(float r){
  float f = clamp(r, 0.0, 0.999) * 31.0;
  int i = int(floor(f));
  int j = i + 1; if (j > 31) j = 31;
  return mix(uBands[i], uBands[j], fract(f));
}

void main(){
  vec3 dir = normalize(position);
  float m = 1.0 - uReduced*0.85;                 // atenuador de movimiento reducido
  // 0 = centro visible, 1 = borde (ecuador). El hemisferio trasero espeja.
  float rr = aRing < 0.5 ? aRing*2.0 : (1.0-aRing)*2.0;
  float e  = bandAt(rr);

  // ── volado elegante: centro sereno, ondas que crecen hacia el borde ──
  float ramp = pow(smoothstep(0.22, 0.85, rr), 1.4);
  float ph = aRing*22.0;
  float ondas = sin(aAngle*5.0  + uTime*0.50 + ph)         * 0.48
              + sin(aAngle*9.0  - uTime*0.34 + ph*1.7+1.3) * 0.30
              + sin(aAngle*16.0 + uTime*0.72 - ph*0.6)     * 0.16
              + sin(aAngle*27.0 - uTime*0.90 + aRand*6.28) * 0.06;
  float ruffle = ramp * ondas * (0.085 + 0.10*uRMS*uSens) * m;

  // respiración sutil + ondas concéntricas del núcleo
  float breath = sin(uTime*0.55 + aRing*PI*2.0 + aRand*3.0)*0.006*m + 0.002;
  float centro = smoothstep(0.16, 0.0, rr);
  float ripple = centro * sin(rr*34.0 - uTime*2.2) * 0.010 * m;

  // audio: expansión por banda (más en el borde) + latido de graves
  float bandPush = e * (0.035 + 0.075*uSens) * (0.35 + ramp*0.65);
  float bassPush = uBass * 0.05 * uSens;

  // abultamiento de la frecuencia dominante: la membrana empujada desde dentro
  float da = abs(atan(sin(aAngle - uPushAngle), cos(aAngle - uPushAngle))) / PI;
  float dr = abs(rr - uPushRing);
  float bulge = uPushAmt * exp(-da*da*10.0 - dr*dr*16.0) * (0.4 + ramp*0.6);

  // TODO desplazamiento es radial: la esfera jamás se rompe en tentáculos
  float disp = breath + ripple + ruffle + bandPush + bassPush + bulge*0.16*uSens;
  disp = clamp(disp, -0.10, 0.30);
  vec3 pos = dir * (1.0 + disp);

  vShade  = clamp(0.55 + ruffle*4.2 + bulge*0.6, 0.18, 1.30); // crestas brillan, valles se apagan
  vEnergy = clamp(e*1.0 + bulge*1.3 + uRMS*0.22, 0.0, 1.5);
  vWarm   = clamp(bulge*1.5, 0.0, 1.0);
  vRR     = rr;
  vWorld  = (modelMatrix * vec4(pos, 1.0)).xyz;

  vec4 mv = modelViewMatrix * vec4(pos, 1.0);
  gl_Position = projectionMatrix * mv;
  float ps = uSize * (0.85 + vEnergy*0.6) * uScale / max(-mv.z, 0.1);
  gl_PointSize = clamp(ps, 1.0, 5.0);
}
`;

const FRAG = `
precision mediump float;
varying float vEnergy;
varying float vWarm;
varying float vShade;
varying float vRR;
varying vec3  vWorld;
void main(){
  vec2 uv = gl_PointCoord*2.0 - 1.0;
  float d = dot(uv, uv);
  if (d > 1.0) discard;
  float alpha = exp(-d*3.2) * 0.9;

  // núcleo blanco caliente → rosa fuego → exterior violeta (abajo-izq) / cian (arriba-der)
  float t = clamp((vWorld.x + vWorld.y)*0.30 + 0.5, 0.0, 1.0);
  vec3 cian    = vec3(0.20, 0.75, 1.00);
  vec3 violeta = vec3(0.45, 0.15, 0.85);
  vec3 magenta = vec3(1.00, 0.25, 0.80);
  vec3 blanco  = vec3(1.00, 0.97, 0.99);
  vec3 exterior = mix(violeta, cian, t);
  vec3 col = mix(magenta, exterior, smoothstep(0.18, 0.70, vRR));
  col = mix(blanco, col, smoothstep(0.02, 0.16, vRR));
  col *= vShade;                                              // sombreado del volado (tela)
  col = mix(col, vec3(1.0, 0.62, 0.42), vWarm*0.5);           // tinte cálido en la dominante
  col = mix(col, vec3(1.0), clamp(vEnergy*vEnergy*0.45, 0.0, 0.75)); // blanco en picos
  gl_FragColor = vec4(col * (0.42 + vEnergy*0.70), alpha);
}
`;

const uniforms = {
  uTime:      { value: 0 },
  uRMS:       { value: 0 },
  uBass:      { value: 0 },
  uSens:      { value: 1 },
  uReduced:   { value: reducirMotion ? 1 : 0 },
  uScale:     { value: 300 },
  uSize:      { value: 0.0032 },
  uPushAngle: { value: -0.6 },
  uPushRing:  { value: 0.4 },
  uPushAmt:   { value: 0 },
  uBands:     { value: new Float32Array(BANDAS) },
};

const materialPuntos = new THREE.ShaderMaterial({
  uniforms, vertexShader: VERT, fragmentShader: FRAG,
  blending: THREE.AdditiveBlending, depthWrite: false, depthTest: true, transparent: true,
});

let nivelActual = reducirMotion ? 'baja' : nivelAuto();
let modoCalidad = 'auto';
let puntos = null;

function reconstruir(nivel){
  nivelActual = nivel;
  if (puntos){ spinner.remove(puntos); puntos.geometry.dispose(); }
  puntos = new THREE.Points(construirGeometria(NIVELES[nivel].puntos), materialPuntos);
  spinner.add(puntos);
  ajustarTamano();
}

/* ══════════════ Motor de audio (demo / micrófono / externo Tauri) ══════════════ */
const audio = {
  modo: 'demo',                       // 'demo' | 'mic' | 'externo'
  bandas: new Float32Array(BANDAS),   // 0..1 suavizadas
  rms: 0, bass: 0,
  dom: BANDAS*0.35, pushAmt: 0, pushAngle: -0.6,
  sens: 1,
  ctx: null, analyser: null, stream: null,
  freq: null, tiempo: null, picos: new Float32Array(BANDAS).fill(0.18),
  rangos: null,
};

function suavizar(actual, objetivo, subida, bajada){
  return objetivo > actual ? actual + (objetivo-actual)*subida
                           : actual + (objetivo-actual)*bajada;
}

/* — Modo demo: respiración sintética convincente sin micrófono — */
function demoTick(t){
  const c1 = (Math.sin(t*0.21)+1)/2;
  const c2 = (Math.sin(t*0.13+2.1)+1)/2;
  for (let i=0;i<BANDAS;i++){
    const x = i/(BANDAS-1);
    const g1 = Math.exp(-Math.pow(x-c1,2)/0.015) * (0.60+0.40*Math.sin(t*1.9));
    const g2 = Math.exp(-Math.pow(x-c2,2)/0.030) * (0.50+0.50*Math.sin(t*2.7+1.0));
    const objetivo = 0.10 + 0.30*g1 + 0.20*g2;
    audio.bandas[i] = suavizar(audio.bandas[i], objetivo, 0.30, 0.08);
  }
  audio.rms  = suavizar(audio.rms, 0.11 + 0.05*Math.sin(t*0.9), 0.2, 0.06);
  audio.bass = (audio.bandas[0]+audio.bandas[1]+audio.bandas[2]+audio.bandas[3])/4;
  actualizarDominante(t, 0.55);
}

/* — Micrófono: Web Audio API · FFT 1024 → 512 bins → 32 bandas log — */
async function activarMic(){
  try{
    audio.stream = await navigator.mediaDevices.getUserMedia({
      audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:true }
    });
    audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
    await audio.ctx.resume();
    const src = audio.ctx.createMediaStreamSource(audio.stream);
    audio.analyser = audio.ctx.createAnalyser();
    audio.analyser.fftSize = 1024;                 // → 512 bandas de frecuencia
    audio.analyser.smoothingTimeConstant = 0.72;
    src.connect(audio.analyser);
    audio.freq   = new Uint8Array(512);
    audio.tiempo = new Uint8Array(1024);
    // rangos logarítmicos 70 Hz → ~7.8 kHz sobre los 512 bins
    const nyq = audio.ctx.sampleRate/2;
    const fLo = 70, fHi = Math.min(7800, nyq*0.95);
    audio.rangos = [];
    for (let k=0;k<BANDAS;k++){
      const f0 = fLo*Math.pow(fHi/fLo, k/BANDAS);
      const f1 = fLo*Math.pow(fHi/fLo, (k+1)/BANDAS);
      const b0 = Math.max(0, Math.floor(f0/nyq*512));
      const b1 = Math.min(511, Math.max(b0+1, Math.ceil(f1/nyq*512)));
      audio.rangos.push([b0,b1]);
    }
    audio.modo = 'mic';
    ponerEstado('MICRÓFONO <b>ACTIVO</b> · procesamiento 100% local');
    btnMic.textContent = '⏹ Detener micrófono';
    btnMic.classList.add('activo');
  }catch(err){
    ponerEstado('sin permiso de micrófono · sigo en <b>DEMO</b>');
    console.warn('Micrófono no disponible:', err);
  }
}

function detenerMic(){
  if (audio.stream){ audio.stream.getTracks().forEach(t => t.stop()); audio.stream = null; }
  if (audio.ctx){ audio.ctx.close().catch(()=>{}); audio.ctx = null; }
  audio.analyser = null;
  audio.modo = 'demo';
  ponerEstado('MODO <b>DEMO</b> · respiración sintética');
  btnMic.textContent = '🎤 Probar con micrófono';
  btnMic.classList.remove('activo');
}

function micTick(t){
  const an = audio.analyser;
  if (!an) return;
  an.getByteFrequencyData(audio.freq);
  an.getByteTimeDomainData(audio.tiempo);
  for (let k=0;k<BANDAS;k++){
    const [b0,b1] = audio.rangos[k];
    let s = 0;
    for (let b=b0;b<b1;b++) s += audio.freq[b];
    let v = (s/(b1-b0))/255;
    // AGC por banda: normaliza micrófonos silenciosos o ruidosos
    audio.picos[k] = Math.max(audio.picos[k]*0.996, v, 0.18);
    v = Math.min(1, v/audio.picos[k]);
    audio.bandas[k] = suavizar(audio.bandas[k], v, 0.55, 0.10);
  }
  let acc = 0;
  for (let i=0;i<1024;i++){ const d=(audio.tiempo[i]-128)/128; acc += d*d; }
  const rmsCrudo = Math.sqrt(acc/1024) * 2.2;
  audio.rms  = suavizar(audio.rms, Math.min(1, rmsCrudo), 0.40, 0.07);
  audio.bass = (audio.bandas[0]+audio.bandas[1]+audio.bandas[2]+audio.bandas[3])/4;
  actualizarDominante(t, 1.0);
}

/* — Dominante → empuje que migra suavemente por la membrana — */
function actualizarDominante(t, fuerza){
  let mi = 0, mv = 0;
  for (let i=0;i<BANDAS;i++){ if (audio.bandas[i] > mv){ mv = audio.bandas[i]; mi = i; } }
  audio.dom += (mi - audio.dom)*0.07;
  const objetivo = Math.max(0, Math.min(1, (mv-0.30)*1.7)) * fuerza;
  audio.pushAmt = suavizar(audio.pushAmt, objetivo, 0.10, 0.05);
  const angObjetivo = -Math.PI/4 + (audio.dom/(BANDAS-1) - 0.5)*1.8 + Math.sin(t*0.35)*0.25;
  audio.pushAngle += (angObjetivo - audio.pushAngle)*0.06;
}

/* — Datos externos (Tauri): acepta 16, 32 o N bandas y re-muestrea — */
let externoTimeout = null;
function setAudioData(bandas, rms, bass, domIdx){
  if (!bandas || !bandas.length) return;
  audio.modo = 'externo';
  const n = bandas.length;
  for (let k=0;k<BANDAS;k++){
    const f = k/(BANDAS-1)*(n-1);
    const i = Math.floor(f), j = Math.min(n-1, i+1);
    const v = Math.max(0, Math.min(1, bandas[i] + (bandas[j]-bandas[i])*(f-i)));
    audio.bandas[k] = suavizar(audio.bandas[k], v, 0.55, 0.12);
  }
  const rmsV = (typeof rms === 'number') ? rms
             : audio.bandas.reduce((a,b)=>a+b,0)/BANDAS;
  audio.rms  = suavizar(audio.rms, Math.min(1, rmsV), 0.40, 0.08);
  audio.bass = (typeof bass === 'number') ? bass
             : (audio.bandas[0]+audio.bandas[1]+audio.bandas[2]+audio.bandas[3])/4;
  if (typeof domIdx === 'number') audio.dom += (domIdx/(n-1)*(BANDAS-1) - audio.dom)*0.1;
  ponerEstado('DATOS <b>EXTERNOS</b> · espectro del backend');
  clearTimeout(externoTimeout);
  externoTimeout = setTimeout(() => { if (audio.modo === 'externo') iniciarDemo(); }, 1500);
}

function iniciarDemo(){ if (audio.modo === 'mic') detenerMic(); audio.modo = 'demo';
  ponerEstado('MODO <b>DEMO</b> · respiración sintética'); }

/* ══════════════ Interacción: arrastre con inercia y retorno orgánico ══════════════ */
const tilt = { x:0, y:0, vx:0, vy:0, activo:false, px:0, py:0 };
canvas.addEventListener('pointerdown', e => {
  tilt.activo = true; tilt.px = e.clientX; tilt.py = e.clientY;
  canvas.classList.add('arrastrando');
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!tilt.activo) return;
  const dx = e.clientX - tilt.px, dy = e.clientY - tilt.py;
  tilt.px = e.clientX; tilt.py = e.clientY;
  tilt.vy = dx*0.004; tilt.vx = dy*0.004;
  tilt.y = Math.max(-1.1, Math.min(1.1, tilt.y + tilt.vy));
  tilt.x = Math.max(-1.1, Math.min(1.1, tilt.x + tilt.vx));
});
function soltar(){ tilt.activo = false; canvas.classList.remove('arrastrando'); }
canvas.addEventListener('pointerup', soltar);
canvas.addEventListener('pointercancel', soltar);

/* ══════════════ UI ══════════════ */
const btnMic  = document.getElementById('btnMic');
const btnFps  = document.getElementById('btnFps');
const elFps   = document.getElementById('fps');
const elEstado= document.getElementById('estado');
const selCal  = document.getElementById('calidad');
const inSens  = document.getElementById('sens');

function ponerEstado(html){ elEstado.innerHTML = html; }
btnMic.addEventListener('click', () => (audio.modo === 'mic') ? detenerMic() : activarMic());
btnFps.addEventListener('click', () => elFps.classList.toggle('visible'));
inSens.addEventListener('input', () => { audio.sens = parseFloat(inSens.value); });
selCal.addEventListener('change', () => {
  modoCalidad = selCal.value;
  reconstruir(modoCalidad === 'auto' ? nivelAuto() : modoCalidad);
});
if (reducirMotion) document.getElementById('avisoMotion').style.display = 'block';

/* ══════════════ Tamaño y calidad adaptativa ══════════════ */
function ajustarTamano(){
  const dprMax = NIVELES[nivelActual].dpr;
  const dpr = Math.min(devicePixelRatio || 1, dprMax);
  renderer.setPixelRatio(dpr);
  renderer.setSize(innerWidth, innerHeight);
  camara.aspect = innerWidth/innerHeight;
  camara.updateProjectionMatrix();
  uniforms.uScale.value = (innerHeight*dpr) / (2*Math.tan(camara.fov*Math.PI/360));
}
addEventListener('resize', ajustarTamano);

/* watchdog de FPS: en Auto, baja de nivel si no da la máquina */
let framesSeg = 0, ultimoSeg = performance.now(), fpsProm = 60, segBajos = 0;
function medirFps(ahora){
  framesSeg++;
  if (ahora - ultimoSeg >= 1000){
    fpsProm = framesSeg; framesSeg = 0; ultimoSeg = ahora;
    elFps.textContent = fpsProm + ' fps · ' + NIVELES[nivelActual].puntos.toLocaleString('es-CL') + ' puntos · ' + nivelActual;
    if (modoCalidad === 'auto' && !reducirMotion){
      segBajos = (fpsProm < 42) ? segBajos+1 : 0;
      if (segBajos >= 3){
        segBajos = 0;
        if (nivelActual === 'alta') reconstruir('media');
        else if (nivelActual === 'media') reconstruir('baja');
      }
    }
  }
}

/* ══════════════ Bucle principal ══════════════ */
const reloj = new THREE.Clock();
function animar(){
  requestAnimationFrame(animar);
  const t = reloj.getElapsedTime();
  const ahora = performance.now();

  if (audio.modo === 'demo') demoTick(t);
  else if (audio.modo === 'mic') micTick(t);
  /* 'externo': los datos llegan por setAudioData() */

  uniforms.uTime.value = t;
  uniforms.uRMS.value  = audio.rms;
  uniforms.uBass.value = audio.bass;
  uniforms.uSens.value = audio.sens;
  uniforms.uBands.value = audio.bandas;
  uniforms.uPushAmt.value   = audio.pushAmt;
  uniforms.uPushAngle.value = audio.pushAngle;
  uniforms.uPushRing.value  = 0.15 + (audio.dom/(BANDAS-1))*0.75;

  /* rotación lenta de planeta + leve precesión; el arrastre inclina y vuelve solo */
  const velGiro = reducirMotion ? 0.006 : 0.05;
  spinner.rotation.z = t * velGiro;
  const wobX = reducirMotion ? 0 : Math.sin(t*0.30)*0.05;
  const wobY = reducirMotion ? 0 : Math.cos(t*0.23)*0.06;
  if (!tilt.activo){
    tilt.y += tilt.vy; tilt.x += tilt.vx;
    tilt.vx *= 0.94; tilt.vy *= 0.94;
    tilt.x *= 0.985; tilt.y *= 0.985;
  }
  holder.rotation.x = wobX + tilt.x;
  holder.rotation.y = wobY + tilt.y;

  /* núcleo brillante late con el volumen y los graves */
  const lat = 0.32 + audio.rms*0.45*audio.sens + audio.bass*0.30;
  nucleoGlow.scale.setScalar(reducirMotion ? 0.34 : lat);
  nucleoGlow.material.opacity = 0.55 + audio.rms*0.4;
  haloRosa.material.opacity   = 0.32 + audio.rms*0.25;

  renderer.render(escena, camara);
  medirFps(ahora);
}

/* ══════════════ API pública para la app Tauri ══════════════ */
window.ESFERA = {
  setAudioData,
  startDemo: iniciarDemo,
  setSensitivity(v){ audio.sens = Math.max(0.2, Math.min(2.5, v)); inSens.value = audio.sens; },
  setQuality(q){ if (q === 'auto'){ modoCalidad='auto'; reconstruir(nivelAuto()); }
                 else if (NIVELES[q]){ modoCalidad=q; reconstruir(q); } },
};

/* ══════════════ Arranque ══════════════ */
reconstruir(nivelActual);
selCal.value = 'auto';
animar();
</script>
</body>
</html>
